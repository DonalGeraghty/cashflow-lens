services:
  # Production-style build served by nginx: http://localhost:8080
  app:
    build:
      context: .
      args:
        # Read from .env next to this file (optional; see README → Google Sheets).
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    image: cashflow-lens:latest
    container_name: cashflow-lens
    ports:
      # Bound to loopback only, so other devices on your network can't reach it.
      # Open it as http://localhost:8080 (Google sign-in doesn't accept raw IPs).
      - "127.0.0.1:8080:80"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp

  # Optional dev server with hot reload: http://127.0.0.1:5173
  # Start with:  docker compose --profile dev up dev
  dev:
    profiles: ["dev"]
    image: node:24-alpine
    container_name: cashflow-lens-dev
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    environment:
      DOCKER_DEV: "true"
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - .:/app
      # Keep the container's Linux node_modules separate from the host's.
      - dev_node_modules:/app/node_modules

volumes:
  dev_node_modules:
